# Project-wide Gradle settings.
android.useAndroidX=true
android.enableJetifier=true

# Memory settings - New Architecture builds are heavy on RAM
# Reduced to 3GB for better compatibility on most systems
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Stability fixes for Windows build errors
org.gradle.daemon=true
org.gradle.vfs.watch=false
org.gradle.parallel=false
org.gradle.workers.max=1

# Architecture targeting
reactNativeArchitectures=x86_64

# New architecture settings
hermesEnabled=true
edgeToEdgeEnabled=false
kotlin.incremental=false
